<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>add title of landing page</title>
  <style>
    /* Removes default margins and sets up a full-height layout */
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Styles for the left navigation bar */
    nav {
      width: 250px;
      background-color: #2c3e50;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Styles for the navigation links */
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      background-color: #34495e;
    }

    nav a:hover {
      background-color: #465c71;
    }

    /* Styles for the main content area */
    main {
      flex: 1;
      padding: 40px;
      background-color: #f4f4f9;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="#">Topic 1</a>
    <a href="#">Topic 2</a>
    <a href="#">Topic</a>
  </nav>

  <!-- Main Content -->
  <main>
    <h1>add title of landing page</h1>
    <p>Welcome to your new GitHub Pages landing page. You can add your main content and image gallery here.</p>
  </main>

</body>
</html>
