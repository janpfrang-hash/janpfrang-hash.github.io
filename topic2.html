<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Page Title</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: row; 
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Left Navigation Bar */
    nav {
      width: 250px;
      min-width: 250px;
      background-color: #2c3e50;
      padding: 20px;
      box-sizing: border-box;
    }

    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      background-color: #34495e;
    }

    nav a:hover {
      background-color: #465c71;
    }

    /* Right Side (Content + Footer) */
    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #f4f4f9;
    }

    /* Main Content Area */
    main {
      flex: 1; 
      padding: 40px;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    /* Footer */
    footer {
      background-color: #e2e2e2;
      padding: 20px;
      text-align: center;
      border-top: 1px solid #ccc;
    }

    footer a {
      color: #2c3e50;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      padding: 8px 16px;
    }

    /* Styling specifically for the BACK button */
    footer a.back-btn {
      background-color: #2c3e50;
      color: white;
      border-radius: 4px;
    }

    footer a:hover {
      text-decoration: underline;
    }
    
    footer a.back-btn:hover {
      background-color: #465c71;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar (Left) -->
  <nav>
    <a href="topic1.html">Topic 1</a>
    <a href="topic2.html">Topic 2</a>
    <a href="topic3.html">Topic 3</a>
  </nav>

  <!-- Right Side Wrapper -->
  <div class="page-wrapper">
    
    <!-- Main Content -->
    <main>
      <h1>Topic Title2</h1>
      <p>This is the content for this specific topic2 page. You can add your images, text, or gallery here.</p>
    </main>

    <!-- Footer (Bottom) -->
    <footer>
      <a href="index.html" class="back-btn">⬅ BACK to Home</a>
      <a href="#">Footer Link 1</a>
      <a href="#">Footer Link 2</a>
    </footer>

  </div>

</body>
</html>
